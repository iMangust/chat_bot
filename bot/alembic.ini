# Конфигурация Alembic (миграции БД).
#
# ВАЖНО: sqlalchemy.url НЕ задаётся здесь — строка подключения берётся из
# app.config.get_settings() (env DATABASE_URL / .env) в alembic/env.py,
# чтобы секреты не попадали в репозиторий.
#
# Запуск (из каталога bot/):
#   alembic revision --autogenerate -m "описание"   # создать миграцию
#   alembic upgrade head                            # применить миграции
#   alembic stamp head                              # пометить живую БД как актуальную

# ВАЖНО: секция должна называться [alembic] — Alembic читает настройки только из неё.
[alembic]
script_location = alembic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
