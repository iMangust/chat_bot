[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -p no:libtmux

[coverage:run]
source = app
omit =
    tests/*
    app/console/static/*
    */__pycache__/*

[coverage:report]
# Ratchet: current measured coverage is 36%; threshold set just below to lock it in.
# Raise this number as tests are added — CI fails if coverage drops under it.
fail_under = 35
show_missing = False
